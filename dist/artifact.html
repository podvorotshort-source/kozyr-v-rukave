<title>Козырь в рукаве</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=PT+Sans+Narrow:wght@700&family=PT+Sans:wght@400;700&family=Yeseva+One&display=swap">
<style>
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --felt: #1d4739;
  --felt-deep: #0c241c;
  --lamp: rgba(255, 208, 128, 0.17);
  --check: rgba(255, 255, 255, 0.034);
  --paper: #f4ecda;
  --paper-2: #e8dcc1;
  --paper-edge: #cbbd9c;
  --ink: #1e1b17;
  --ink-red: #b3261e;
  --brass: #d5a24a;
  --brass-hi: #f3d080;
  --brass-lo: #7d5a22;
  --walnut: #1d130d;
  --walnut-2: #2a1c13;
  --walnut-3: #3a281b;
  --cream: #f1e4c8;
  --cream-dim: #b9a986;
  --heart: #e9554a;
  --good: #9ad992;
  --bad: #ff9584;
  --notebook: #fbf8f0;
  --grid: #cfdcec;
  --margin-line: #e3928a;
  --pencil: #2a3970;
  --back: #8e2323;
  --q1: #d9d0b9;
  --q2: #7cc3e6;
  --q3: #c7a1f3;
  --q4: #f2bd4f;
  --font-display: 'Yeseva One', Georgia, 'Times New Roman', serif;
  --font-ui: 'PT Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  --font-narrow: 'PT Sans Narrow', 'Arial Narrow', 'PT Sans', sans-serif;
  --font-hand: 'Neucha', 'Segoe Print', 'Comic Sans MS', cursive;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--felt-deep);
  color: var(--cream);
  font-family: var(--font-ui);
  font-size: 15px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

button { font: inherit; color: inherit; }

#app {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding-inline: 16px;
  background:
    radial-gradient(ellipse 70% 55% at 50% 40%, var(--lamp), transparent 72%),
    radial-gradient(ellipse 125% 95% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.6)),
    repeating-linear-gradient(0deg, var(--check) 0 10px, transparent 10px 20px),
    repeating-linear-gradient(90deg, var(--check) 0 10px, transparent 10px 20px),
    var(--felt);
}

/* ---------- верхняя панель забега ---------- */
#topbar {
  position: relative;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 10px 16px;
  padding-block: 8px 4px;
  flex-wrap: wrap;
}
.hud-group { display: flex; align-items: center; gap: 12px; }
.hearts { font-size: 20px; letter-spacing: 1px; color: var(--heart); line-height: 1; }
.hearts .lost { color: rgba(233, 85, 74, 0.28); }
.coins {
  font-family: var(--font-hand);
  font-size: 26px;
  line-height: 1;
  color: var(--brass-hi);
  font-variant-numeric: tabular-nums;
}
.coins small { font-size: 18px; margin-left: 3px; }
.coin {
  display: inline-block;
  width: 0.72em;
  height: 0.72em;
  margin-left: 0.14em;
  border-radius: 50%;
  vertical-align: -0.06em;
  background: radial-gradient(circle at 35% 30%, #fff1c2, var(--brass-hi) 30%, var(--brass) 62%, var(--brass-lo));
  box-shadow: inset 0 0 0 0.07em rgba(125, 90, 34, 0.75), 0 0.04em 0.08em rgba(0, 0, 0, 0.35);
}
.progress {
  font-family: var(--font-narrow);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cream-dim);
}
.progress b { color: var(--cream); }
.trays { display: flex; align-items: center; gap: 14px; margin-left: auto; flex-wrap: wrap; }
.tray { display: flex; gap: 6px; align-items: center; }
.tray-label {
  font-family: var(--font-narrow);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--cream-dim);
  margin-right: 2px;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid rgba(241, 228, 200, 0.25);
  background: rgba(0, 0, 0, 0.25);
  cursor: pointer;
  font-size: 18px;
  display: grid;
  place-items: center;
}
.icon-btn:hover { background: rgba(0, 0, 0, 0.4); }

.token {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 19px;
  background: radial-gradient(circle at 34% 28%, var(--brass-hi), var(--brass) 46%, var(--brass-lo));
  box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.35), inset 0 2px 2px rgba(255, 255, 255, 0.35), 0 2px 5px rgba(0, 0, 0, 0.45), 0 0 0 2px var(--rq, transparent);
}
.token.q2 { --rq: var(--q2); }
.token.q3 { --rq: var(--q3); }
.token.q4 { --rq: var(--q4); }
.token .dot {
  position: absolute;
  right: -2px;
  top: -2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--good);
  box-shadow: 0 0 0 2px var(--walnut);
}
.token.spent { filter: grayscale(0.8) brightness(0.7); }
.token.fire { animation: wiggle 0.6s var(--ease); }
.slot {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1.5px dashed rgba(241, 228, 200, 0.22);
}
.trick {
  position: relative;
  width: 32px;
  height: 44px;
  border-radius: 5px;
  border: 0;
  padding: 0;
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 18px;
  background: linear-gradient(160deg, #fffaf0, var(--paper) 60%, var(--paper-2));
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45), inset 0 0 0 2px #fff, inset 0 0 0 3px var(--brass);
}
.trick.armed { box-shadow: 0 0 0 3px var(--brass-hi), 0 2px 8px rgba(0, 0, 0, 0.5); transform: translateY(-3px); }
.trick-slot {
  width: 32px;
  height: 44px;
  border-radius: 5px;
  border: 1.5px dashed rgba(241, 228, 200, 0.22);
}
.token:focus-visible, .trick:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .card:focus-visible {
  outline: 3px solid var(--q2);
  outline-offset: 3px;
}

/* ---------- сцены ---------- */
#stage { position: relative; flex: 1; min-height: 0; }
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding-block: 8px 24px; }
#screen-game { overflow: hidden; padding: 0; }
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

/* ---------- кнопки ---------- */
.btn {
  font-family: var(--font-narrow);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 11px 20px;
  border-radius: 10px;
  border: 1px solid var(--brass-lo);
  background: linear-gradient(var(--brass-hi), var(--brass) 55%, #b9832f);
  color: #2a1a08;
  box-shadow: 0 3px 0 var(--brass-lo), 0 7px 16px rgba(0, 0, 0, 0.35);
  cursor: pointer;
  white-space: nowrap;
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--brass-lo), 0 3px 8px rgba(0, 0, 0, 0.3); }
.btn[disabled] { filter: grayscale(0.7) brightness(0.7); cursor: not-allowed; }
.btn.ghost {
  background: rgba(0, 0, 0, 0.28);
  color: var(--cream);
  border-color: rgba(241, 228, 200, 0.3);
  box-shadow: none;
}
.btn.small { font-size: 13px; padding: 7px 12px; }
.btn.big { font-size: 19px; padding: 14px 28px; }
.btn.pulse { animation: btnpulse 1.4s ease-in-out infinite; }

/* ---------- карты ---------- */
#board { position: absolute; inset: 0; --cw: 80px; --ch: 112px; }
.card {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--cw);
  height: var(--ch);
  transition: transform 0.42s var(--ease);
  will-change: transform;
  perspective: 900px;
}
.card .cin {
  position: absolute;
  inset: 0;
  border-radius: calc(var(--cw) * 0.085);
  transform-style: preserve-3d;
  transition: transform 0.38s var(--ease);
}
.card.down .cin { transform: rotateY(180deg); }
.card .front, .card .back {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.card .front {
  overflow: hidden;
  color: var(--ink);
  background: linear-gradient(160deg, #fdf8ea, var(--paper) 58%, var(--paper-2));
  border: 1px solid var(--paper-edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 3px 9px rgba(0, 0, 0, 0.38);
}
.card.red .front { color: var(--ink-red); }
.card .back {
  transform: rotateY(180deg);
  border: calc(var(--cw) * 0.055) solid #efe5cf;
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 228, 170, 0.22) 0 14%, transparent 15%),
    repeating-linear-gradient(45deg, rgba(255, 215, 140, 0.24) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(255, 215, 140, 0.24) 0 1px, transparent 1px 7px),
    var(--back);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3), 0 3px 9px rgba(0, 0, 0, 0.38);
}
.corner {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: var(--font-narrow);
  font-weight: 700;
  font-size: calc(var(--cw) * 0.23);
  line-height: 0.92;
}
.corner i { font-style: normal; font-size: 0.82em; }
.corner.tl { left: 5%; top: 4%; }
.corner.br { right: 5%; bottom: 4%; transform: rotate(180deg); }
.pips { position: absolute; inset: 13% 20%; }
.pip {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: calc(var(--cw) * 0.2);
  line-height: 1;
}
.pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
.court {
  position: absolute;
  inset: 15% 19%;
  border: 1px solid currentColor;
  border-radius: calc(var(--cw) * 0.05);
  display: grid;
  place-items: center;
  background: repeating-linear-gradient(135deg, transparent 0 4px, rgba(0, 0, 0, 0.035) 4px 5px);
}
.court b { font-family: var(--font-display); font-weight: 400; font-size: calc(var(--cw) * 0.46); line-height: 1; }
.court i { position: absolute; bottom: 4%; font-style: normal; font-size: calc(var(--cw) * 0.16); }
.court::before {
  content: attr(data-s);
  position: absolute;
  top: 4%;
  font-size: calc(var(--cw) * 0.16);
}
.ace { position: absolute; inset: 0; display: grid; place-items: center; }
.ace span {
  font-size: calc(var(--cw) * 0.56);
  line-height: 1;
  filter: drop-shadow(0 1px 0 rgba(255, 255, 255, 0.6));
}
.ace::after {
  content: '';
  position: absolute;
  width: 58%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 1px dashed currentColor;
  opacity: 0.45;
}
.badge {
  position: absolute;
  right: 4%;
  top: 4%;
  min-width: calc(var(--cw) * 0.22);
  height: calc(var(--cw) * 0.22);
  padding-inline: 2px;
  border-radius: 999px;
  background: var(--pencil);
  color: #fff;
  font-family: var(--font-narrow);
  font-size: calc(var(--cw) * 0.15);
  display: grid;
  place-items: center;
}
.badge + .badge { top: 30%; }
.badge.wild { background: var(--brass-lo); color: var(--brass-hi); }
.card.wild .front { box-shadow: inset 0 0 0 2px var(--brass), 0 0 14px rgba(243, 208, 128, 0.55); }

.card.mine { cursor: default; }
.card.mine.trump .front::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 2px rgba(213, 162, 74, 0.85);
  pointer-events: none;
}
.card.playable { cursor: pointer; }
@media (hover: hover) {
  .card.playable:hover .cin { transform: translateY(-13%); }
}
.card.dim .front { filter: brightness(0.7) saturate(0.6); }
.card.sel .cin { transform: translateY(-17%); }
.card.sel .front { box-shadow: 0 0 0 3px var(--brass-hi), 0 8px 16px rgba(0, 0, 0, 0.45); }
.card.tgt { cursor: pointer; }
.card.tgt .front { animation: tgtpulse 1s ease-in-out infinite; }
.card.nope .cin { animation: nope 0.35s; }
.card.open .front { box-shadow: 0 0 0 2px rgba(255, 149, 132, 0.55), 0 3px 9px rgba(0, 0, 0, 0.38); }

/* стопки */
.pile {
  position: absolute;
  width: var(--cw);
  height: var(--ch);
  border-radius: calc(var(--cw) * 0.085);
  pointer-events: none;
}
#deck-pile { z-index: 2; }
#bito-pile { z-index: 34; }
#trump-chip { z-index: 5; }
.pile .count {
  position: absolute;
  left: 50%;
  bottom: -26px;
  transform: translateX(-50%);
  font-family: var(--font-hand);
  font-size: 18px;
  color: var(--cream);
  white-space: nowrap;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
}
#deck-pile .stack, #bito-pile .stack {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: calc(var(--cw) * 0.055) solid #efe5cf;
  background:
    repeating-linear-gradient(45deg, rgba(255, 215, 140, 0.24) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(-45deg, rgba(255, 215, 140, 0.24) 0 1px, transparent 1px 7px),
    var(--back);
}
#deck-pile .stack { box-shadow: 1px 1px 0 #d9ceb5, 2px 2px 0 #c9bea4, 3px 3px 0 #d9ceb5, 4px 4px 0 #b9ae95, 6px 7px 12px rgba(0, 0, 0, 0.4); }
#bito-pile .stack:nth-child(1) { transform: rotate(-9deg); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); }
#bito-pile .stack:nth-child(2) { transform: rotate(6deg) translate(3px, -2px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35); }
.trump-chip {
  position: absolute;
  font-family: var(--font-narrow);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.05em;
  padding: 3px 9px;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.38);
  border: 1px solid rgba(241, 228, 200, 0.25);
  white-space: nowrap;
  transform: translateX(-50%);
  pointer-events: none;
}
.trump-chip .s { font-size: 16px; }
.trump-chip .s.red { color: #ff8a80; }

/* соперник */
#opp {
  position: absolute;
  left: 0;
  top: 4px;
  z-index: 70;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 300px;
}
.portrait {
  flex: none;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 30px;
  background: radial-gradient(circle at 40% 30%, var(--walnut-3), var(--walnut));
  box-shadow: 0 0 0 2px var(--brass), 0 4px 10px rgba(0, 0, 0, 0.45);
}
.portrait.boss { box-shadow: 0 0 0 2px var(--brass), 0 0 0 5px var(--ink-red), 0 4px 12px rgba(0, 0, 0, 0.5); }
.opp-name { font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.opp-rule {
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.25;
  color: var(--cream-dim);
}
.opp-rule b { color: var(--brass-hi); font-weight: 700; }
.bubble {
  position: absolute;
  z-index: 80;
  max-width: 230px;
  padding: 6px 13px 7px;
  border-radius: 16px;
  background: var(--notebook);
  color: var(--pencil);
  font-family: var(--font-hand);
  font-size: 19px;
  line-height: 1.15;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
  animation: pop 0.25s var(--ease);
  pointer-events: none;
}
.bubble::before {
  content: '';
  position: absolute;
  left: -7px;
  top: 14px;
  border: 7px solid transparent;
  border-right-color: var(--notebook);
  border-left: 0;
}

#hud {
  position: absolute;
  left: 0;
  right: 0;
  z-index: 75;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  pointer-events: none;
}
#status {
  font-size: 15px;
  line-height: 1.3;
  color: var(--cream);
  text-align: center;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
  text-wrap: balance;
  max-width: 460px;
}
#status.mine { color: #fff6df; }
#hud .btn { pointer-events: auto; }
.choice {
  position: absolute;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transform: translate(-50%, -50%);
  filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
}
.choice .btn.ghost { background: var(--walnut-2); }

/* ---------- эффекты ---------- */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 120; }
.float {
  position: absolute;
  font-family: var(--font-hand);
  font-size: 24px;
  color: var(--brass-hi);
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
  white-space: nowrap;
  transform: translate(-50%, -50%);
  animation: floatup 1.3s ease-out forwards;
}
.float.note { color: var(--cream); font-size: 20px; }
.banner {
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%);
  font-family: var(--font-display);
  font-size: clamp(30px, 7vw, 64px);
  color: var(--brass-hi);
  text-shadow: 0 3px 0 var(--brass-lo), 0 10px 26px rgba(0, 0, 0, 0.6);
  white-space: nowrap;
  animation: banner 1.1s var(--ease) forwards;
}
#tip {
  position: fixed;
  z-index: 130;
  width: min(280px, calc(100vw - 32px));
  padding: 12px 14px;
  border-radius: 12px;
  background: var(--walnut-2);
  border: 1px solid var(--brass-lo);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
  font-size: 14px;
  line-height: 1.4;
}
#tip h4 { margin: 0 0 2px; font-family: var(--font-display); font-weight: 400; font-size: 18px; color: var(--brass-hi); }
#tip .rar { font-family: var(--font-narrow); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-dim); }
#tip p { margin: 6px 0 0; }
#tip .tip-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ---------- модальные окна ---------- */
#modal {
  position: fixed;
  inset: 0;
  z-index: 110;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(4, 12, 9, 0.62);
  overflow-y: auto;
}
.sheet {
  position: relative;
  width: min(440px, 100%);
  padding: 22px 26px 22px 46px;
  border-radius: 3px;
  color: var(--pencil);
  font-family: var(--font-hand);
  background-color: var(--notebook);
  background-image:
    linear-gradient(90deg, transparent 30px, var(--margin-line) 30px 31.5px, transparent 31.5px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 100% 100%, 18px 18px, 18px 18px;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  transform: rotate(-0.8deg);
  animation: sheetin 0.35s var(--ease);
}
.sheet h2 { margin: 0 0 4px; font-family: var(--font-hand); font-weight: 400; font-size: 40px; line-height: 1; }
.sheet h2.lose { color: #a6352a; }
.sheet .sub { font-size: 19px; margin-bottom: 12px; color: #4b578c; }
.tally { display: flex; flex-direction: column; gap: 2px; min-height: 24px; }
.tally-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: 21px;
  line-height: 1.3;
  animation: rowin 0.3s var(--ease);
}
.tally-row .v { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally-row.minus { color: #a6352a; }
.tally-total {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 6px;
  border-top: 2px solid var(--pencil);
  font-size: 26px;
}
.sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; font-family: var(--font-ui); }
.panel {
  width: min(560px, 100%);
  max-height: calc(100% - 8px);
  overflow-y: auto;
  padding: 22px 24px;
  border-radius: 14px;
  background: var(--walnut-2);
  border: 1px solid var(--brass-lo);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
  line-height: 1.5;
  animation: sheetin 0.3s var(--ease);
}

<script>
'use strict';
// ===== Движок подкидного дурака на двоих =====
// Игрок 0 — человек, игрок 1 — соперник. Колода: deck[0] — открытый козырь под колодой,
// карты берутся с конца массива.

const SUITS = ['♠', '♣', '♥', '♦'];
const SUIT_NAMES = ['пики', 'трефы', 'червы', 'бубны'];
const SUIT_GEN = ['пик', 'треф', 'червей', 'бубён'];
const RANK_LABEL = { 6: '6', 7: '7', 8: '8', 9: '9', 10: '10', 11: 'В', 12: 'Д', 13: 'К', 14: 'Т' };
const RANK_NAME = { 6: 'шестёрка', 7: 'семёрка', 8: 'восьмёрка', 9: 'девятка', 10: 'десятка', 11: 'валет', 12: 'дама', 13: 'король', 14: 'туз' };
const isRed = (s) => s >= 2;
const sameColor = (a, b) => isRed(a) === isRed(b);
const cardName = (c) => `${RANK_LABEL[c.r]}${SUITS[c.s]}`;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function defaultRules() {
  return {
    minRank: 6,
    handSize: [6, 6],
    limit: [6, 6],            // сколько карт может быть в одном отбое, когда атакует этот игрок
    firstBoutLimit: [5, 5],   // в первом отбое — не больше пяти
    transfer: [false, false], // переводной
    sixBeatsAce: [false, false],
    queenSpades: [false, false],
    jacksTrump: [false, false],
    doubleTrump: [false, false],
    neighborThrow: [false, false],
    freeThrowOnTake: [false, false],
    firstAttacker: null,
  };
}

class DurakGame {
  constructor(rules, rng) {
    this.rules = rules;
    this.rng = rng;
    this.deck = [];
    this.hands = [[], []];
    this.table = [];          // [{a, by, d, dby}]
    this.discard = [];
    this.trumpSuit = 0;
    this.attacker = 0;
    this.defender = 1;
    this.taking = false;
    this.defStart = 0;
    this.boutNo = 0;
    this.over = false;
    this.result = null;       // 'win' | 'lose' | 'draw' — с точки зрения игрока 0
    this.known = [new Set(), new Set()]; // карты, которые все видели у игрока в руке
    this.cards = new Map();
    this.listeners = [];
    this.stats = { bito: [0, 0], took: [0, 0], played: [0, 0] };
  }

  on(fn) { this.listeners.push(fn); }
  emit(type, data = {}) { for (const fn of this.listeners) fn(type, data, this); }

  setup() {
    let id = 0;
    for (let s = 0; s < 4; s++) {
      for (let r = this.rules.minRank; r <= 14; r++) {
        const c = { id: id++, s, r, wild: false };
        this.deck.push(c);
        this.cards.set(c.id, c);
      }
    }
    shuffle(this.deck, this.rng);
    const maxHand = Math.max(...this.rules.handSize);
    for (let i = 0; i < maxHand; i++) {
      for (const p of [0, 1]) {
        if (this.hands[p].length < this.rules.handSize[p] && this.deck.length > 1) this.hands[p].push(this.deck.pop());
      }
    }
    this.trumpSuit = this.deck[0].s;
  }

  get trumpCard() { return this.deck.length ? this.deck[0] : null; }
  get deckSize() { return this.rules.minRank === 6 ? 36 : (15 - this.rules.minRank) * 4; }

  start() {
    let first = this.rules.firstAttacker;
    if (first == null) {
      let best = null;
      for (const p of [0, 1]) {
        for (const c of this.hands[p]) {
          if (c.s === this.trumpSuit && (!best || c.r < best.r)) best = { p, r: c.r };
        }
      }
      first = best ? best.p : (this.rng() < 0.5 ? 0 : 1);
    }
    this.attacker = first;
    this.defender = 1 - first;
    this.defStart = this.hands[this.defender].length;
    this.emit('start', { attacker: first });
  }

  // ---- правила старшинства ----
  isTrump(c, who) {
    if (c.s === this.trumpSuit) return true;
    if (this.rules.jacksTrump[who] && c.r === 11) return true;
    if (this.rules.doubleTrump[who] && sameColor(c.s, this.trumpSuit)) return true;
    return false;
  }

  power(c) { return c.r * 2 + (c.s === this.trumpSuit ? 1 : 0); }

  canBeat(att, attWho, def, defWho) {
    if (def.wild) return true;
    const aT = this.isTrump(att, attWho);
    const dT = this.isTrump(def, defWho);
    if (this.rules.sixBeatsAce[defWho] && def.r === 6 && att.r === 14 && def.s === att.s) return true;
    if (this.rules.queenSpades[defWho] && def.r === 12 && def.s === 0 && !aT) return true;
    if (dT && !aT) return true;
    if (aT && !dT) return false;
    if (aT && dT) return this.power(def) > this.power(att);
    return def.s === att.s && def.r > att.r;
  }

  // ---- состояние отбоя ----
  hasUnbeaten() { return this.table.some((e) => !e.d); }
  allBeaten() { return this.table.length > 0 && this.table.every((e) => e.d); }

  tableRanks() {
    const s = new Set();
    for (const e of this.table) { s.add(e.a.r); if (e.d) s.add(e.d.r); }
    return s;
  }

  boutLimit(who) {
    const lim = this.rules.limit[who];
    return this.boutNo === 0 ? Math.min(lim, this.rules.firstBoutLimit[who]) : lim;
  }

  capacity() { return Math.min(this.boutLimit(this.attacker), this.defStart); }

  // Чей сейчас ход: атакующий подкидывает только когда всё отбито (или когда соперник берёт).
  actor() {
    if (this.over) return null;
    if (this.taking) return this.attacker;
    if (this.hasUnbeaten()) return this.defender;
    return this.attacker;
  }

  rankAllowed(c, who) {
    if (this.table.length === 0) return true;
    if (this.taking && this.rules.freeThrowOnTake[who]) return true;
    const ranks = this.tableRanks();
    if (ranks.has(c.r)) return true;
    return this.rules.neighborThrow[who] && (ranks.has(c.r - 1) || ranks.has(c.r + 1));
  }

  legalAttacks(who) {
    if (this.over || who !== this.attacker || this.actor() !== who) return [];
    if (this.table.length >= this.capacity()) return [];
    return this.hands[who].filter((c) => this.rankAllowed(c, who));
  }

  defendTargets(who, card) {
    if (this.over || who !== this.defender || this.taking) return [];
    const res = [];
    this.table.forEach((e, i) => {
      if (!e.d && this.canBeat(e.a, e.by, card, who)) res.push(i);
    });
    return res;
  }

  canTransferWith(who, card) {
    if (this.over || who !== this.defender || this.taking || !this.rules.transfer[who]) return false;
    if (this.table.length === 0 || this.table.some((e) => e.d)) return false;
    if (!this.table.every((e) => e.a.r === card.r)) return false;
    const newDef = this.attacker;
    return this.table.length + 1 <= Math.min(this.boutLimit(who), this.hands[newDef].length);
  }

  canTake(who) { return !this.over && who === this.defender && !this.taking && this.hasUnbeaten(); }
  canPass(who) { return !this.over && who === this.attacker && !this.taking && this.allBeaten(); }
  canFinishTake(who) { return !this.over && who === this.attacker && this.taking; }

  // ---- действия ----
  _fromHand(who, id) {
    const h = this.hands[who];
    const i = h.findIndex((c) => c.id === id);
    if (i < 0) return null;
    return h.splice(i, 1)[0];
  }

  attack(who, id) {
    const card = this.hands[who].find((c) => c.id === id);
    if (!card || !this.legalAttacks(who).includes(card)) return false;
    this._fromHand(who, id);
    this.table.push({ a: card, by: who, d: null, dby: null });
    this.stats.played[who]++;
    const kind = this.table.length === 1 ? 'lead' : (this.taking ? 'chase' : 'throw');
    this.emit('attack', { who, card, kind });
    return true;
  }

  defend(who, id, target) {
    const card = this.hands[who].find((c) => c.id === id);
    const e = this.table[target];
    if (!card || !e || e.d || who !== this.defender || this.taking || this.over) return false;
    if (!this.canBeat(e.a, e.by, card, who)) return false;
    this._fromHand(who, id);
    e.d = card;
    e.dby = who;
    this.stats.played[who]++;
    this.emit('defend', { who, card, target: e.a });
    return true;
  }

  transfer(who, id) {
    const card = this.hands[who].find((c) => c.id === id);
    if (!card || !this.canTransferWith(who, card)) return false;
    this._fromHand(who, id);
    this.table.push({ a: card, by: who, d: null, dby: null });
    const oldAttacker = this.attacker;
    this.attacker = who;
    this.defender = oldAttacker;
    this.defStart = this.hands[oldAttacker].length;
    this.stats.played[who]++;
    this.emit('transfer', { who, card });
    return true;
  }

  take(who) {
    if (!this.canTake(who)) return false;
    this.taking = true;
    this.emit('take', { who });
    return true;
  }

  pass(who) {
    if (!this.canPass(who)) return false;
    this._endBout(false);
    return true;
  }

  finishTake(who) {
    if (!this.canFinishTake(who)) return false;
    this._endBout(true);
    return true;
  }

  _endBout(taken) {
    const entries = this.table;
    const cards = [];
    for (const e of entries) { cards.push(e.a); if (e.d) cards.push(e.d); }
    const att = this.attacker;
    const def = this.defender;
    this.table = [];
    this.taking = false;
    if (taken) {
      this.hands[def].push(...cards);
      for (const c of cards) this.known[def].add(c.id);
      this.stats.took[def]++;
      this.emit('took', { who: def, cards, entries });
    } else {
      this.discard.push(...cards);
      this.stats.bito[def]++;
      this.emit('bito', { attacker: att, defender: def, cards, entries });
    }
    this.boutNo++;
    this._drawUpTo(att);
    this._drawUpTo(def);
    if (!taken) { this.attacker = def; this.defender = att; }
    this.defStart = this.hands[this.defender].length;
    this._checkEnd();
    if (!this.over) this.emit('bout', { attacker: this.attacker });
  }

  _drawUpTo(p) {
    const drawn = [];
    while (this.hands[p].length < this.rules.handSize[p] && this.deck.length) {
      const c = this.deck.pop();
      this.hands[p].push(c);
      drawn.push(c);
    }
    if (drawn.length) this.emit('draw', { who: p, cards: drawn });
  }

  _checkEnd() {
    if (this.deck.length) return;
    const out0 = this.hands[0].length === 0;
    const out1 = this.hands[1].length === 0;
    if (!out0 && !out1) return;
    this.over = true;
    this.result = out0 && out1 ? 'draw' : out0 ? 'win' : 'lose';
    this.emit('over', { result: this.result });
  }

  // ---- служебное для фокусов и талисманов ----
  cardsInHand(who) { return this.hands[who]; }

  moveToDiscard(who, id) {
    const c = this._fromHand(who, id);
    if (!c) return null;
    this.discard.push(c);
    this.emit('discarded', { who, card: c });
    return c;
  }

  give(from, id) {
    const c = this._fromHand(from, id);
    if (!c) return null;
    const to = 1 - from;
    this.hands[to].push(c);
    this.known[to].add(c.id);
    this.emit('gave', { from, to, card: c });
    return c;
  }

  // Вернуть руку в колоду (над открытым козырем), перемешать и добрать столько же.
  reshuffleHand(who) {
    if (!this.deck.length) return false;
    const n = this.hands[who].length;
    const bottom = this.deck[0];
    const rest = this.deck.slice(1).concat(this.hands[who]);
    this.hands[who] = [];
    shuffle(rest, this.rng);
    this.deck = [bottom, ...rest];
    for (let i = 0; i < n && this.deck.length; i++) this.hands[who].push(this.deck.pop());
    this.known[who].clear();
    this.emit('reshuffled', { who });
    return true;
  }

  // Карта из колоды (не открытый козырь), отвечающая условию — для «подтасовок» при раздаче.
  pullFromDeck(pred) {
    const idx = [];
    for (let i = 1; i < this.deck.length; i++) if (pred(this.deck[i])) idx.push(i);
    if (!idx.length) return null;
    const i = idx[Math.floor(this.rng() * idx.length)];
    return { card: this.deck[i], index: i };
  }

  // Проверка целостности: каждая карта ровно в одном месте.
  checkIntegrity() {
    const seen = new Set();
    const add = (c, where) => {
      if (seen.has(c.id)) throw new Error(`карта ${cardName(c)} дважды (${where})`);
      seen.add(c.id);
    };
    this.deck.forEach((c) => add(c, 'колода'));
    this.hands[0].forEach((c) => add(c, 'рука 0'));
    this.hands[1].forEach((c) => add(c, 'рука 1'));
    this.discard.forEach((c) => add(c, 'бита'));
    for (const e of this.table) { add(e.a, 'стол'); if (e.d) add(e.d, 'стол'); }
    if (seen.size !== this.cards.size) throw new Error(`потерялись карты: ${seen.size}/${this.cards.size}`);
    if (this.table.length > 6) throw new Error('больше шести карт в отбое');
    return true;
  }
}

// ===== Соперник =====
// smart: 0..1 — насколько хорошо играет (бережёт козыри, вовремя берёт, реже ошибается).

function aiValue(g, c, who) {
  let v = c.r;
  if (g.isTrump(c, who)) v += 12;
  if (c.wild) v += 30;
  return v;
}

function aiPlanDefense(g, me) {
  const open = [];
  g.table.forEach((e, i) => { if (!e.d) open.push(i); });
  open.sort((i, j) => aiValue(g, g.table[j].a, g.table[j].by) - aiValue(g, g.table[i].a, g.table[i].by));
  const used = new Set();
  const plan = [];
  for (const i of open) {
    const e = g.table[i];
    let best = null;
    let bestV = Infinity;
    for (const c of g.hands[me]) {
      if (used.has(c.id) || !g.canBeat(e.a, e.by, c, me)) continue;
      const v = aiValue(g, c, me);
      if (v < bestV) { bestV = v; best = c; }
    }
    if (!best) return null;
    used.add(best.id);
    plan.push({ card: best, target: i, v: bestV });
  }
  return plan;
}

function aiLegalActions(g, me) {
  const acts = [];
  if (g.actor() !== me) return acts;
  if (g.taking) {
    for (const c of g.legalAttacks(me)) acts.push({ type: 'attack', id: c.id });
    acts.push({ type: 'finishTake' });
  } else if (me === g.defender && g.hasUnbeaten()) {
    for (const c of g.hands[me]) {
      for (const t of g.defendTargets(me, c)) acts.push({ type: 'defend', id: c.id, target: t });
      if (g.canTransferWith(me, c)) acts.push({ type: 'transfer', id: c.id });
    }
    acts.push({ type: 'take' });
  } else {
    for (const c of g.legalAttacks(me)) acts.push({ type: 'attack', id: c.id });
    if (g.canPass(me)) acts.push({ type: 'pass' });
  }
  return acts;
}

function aiDecide(g, me, smart, rng) {
  const opp = 1 - me;
  const deckLeft = g.deck.length;
  const hand = g.hands[me];
  const val = (c) => aiValue(g, c, me);
  const lowest = (cards) => cards.reduce((a, b) => (val(b) < val(a) ? b : a));

  // Иногда соперник ошибается — тем чаще, чем он проще.
  if (rng() < (1 - smart) * 0.45) {
    const acts = aiLegalActions(g, me).filter((a) => !(a.type === 'take' && deckLeft === 0 && aiPlanDefense(g, me)));
    if (acts.length) return acts[Math.floor(rng() * acts.length)];
  }

  // Соперник берёт — подкидываем вдогонку.
  if (g.taking) {
    const legal = g.legalAttacks(me);
    const good = legal.filter((c) => {
      if (g.isTrump(c, me)) return deckLeft === 0 && c.r <= 9;
      return deckLeft === 0 || c.r <= (smart > 0.6 ? 11 : 13);
    });
    return good.length ? { type: 'attack', id: lowest(good).id } : { type: 'finishTake' };
  }

  // Защита.
  if (me === g.defender && g.hasUnbeaten()) {
    const plan = aiPlanDefense(g, me);
    const transfers = hand.filter((c) => g.canTransferWith(me, c));
    if (transfers.length) {
      const t = lowest(transfers);
      const cheapest = plan ? Math.min(...plan.map((p) => p.v)) : Infinity;
      if (!g.isTrump(t, me) || !plan || deckLeft === 0) {
        if (val(t) <= cheapest + 3) return { type: 'transfer', id: t.id };
      }
    }
    if (!plan) return { type: 'take' };
    if (deckLeft >= 8 && smart >= 0.45) {
      const bigTrump = plan.some((p) => g.isTrump(p.card, me) && p.card.r >= 12);
      const cheapTable = g.table.length <= 2 && g.table.every((e) => aiValue(g, e.a, e.by) <= 9);
      if (bigTrump && cheapTable && rng() < smart * 0.75) return { type: 'take' };
    }
    return { type: 'defend', id: plan[0].card.id, target: plan[0].target };
  }

  // Атака.
  const legal = g.legalAttacks(me);
  if (g.table.length === 0) {
    if (!legal.length) return null;
    const counts = {};
    for (const c of hand) counts[c.r] = (counts[c.r] || 0) + 1;
    const allTrumps = hand.every((c) => g.isTrump(c, me));
    let score = (c) => val(c) - (counts[c.r] - 1) * 2.5 + (g.isTrump(c, me) && !allTrumps ? 6 : 0);
    if (deckLeft === 0 && smart > 0.55 && g.hands[opp].length <= 2) {
      // Под конец бьём самой сильной — пусть попробует отбиться.
      score = (c) => -val(c) - (counts[c.r] - 1) * 3;
    }
    return { type: 'attack', id: legal.reduce((a, b) => (score(b) < score(a) ? b : a)).id };
  }

  // Всё отбито — подкидываем или «бито».
  const cap = deckLeft > 12 ? 10 : deckLeft > 4 ? 12 : 14;
  const good = legal.filter((c) => {
    if (deckLeft === 0) return !g.isTrump(c, me) || c.r <= 11 || hand.length <= 2;
    return !g.isTrump(c, me) && c.r <= cap;
  });
  if (good.length && (smart > 0.3 || rng() < 0.7)) return { type: 'attack', id: lowest(good).id };
  return g.canPass(me) ? { type: 'pass' } : null;
}

function aiApply(g, me, act) {
  if (!act) return false;
  switch (act.type) {
    case 'attack': return g.attack(me, act.id);
    case 'defend': return g.defend(me, act.id, act.target);
    case 'transfer': return g.transfer(me, act.id);
    case 'take': return g.take(me);
    case 'pass': return g.pass(me);
    case 'finishTake': return g.finishTake(me);
    default: return false;
  }
}

function tableInfo(index) {

  return { act, pos: index % 3, actInfo: ACTS[act], opp: ACTS[act].tables[index % 3] };

function buildRules(run, opp) {
  const r = defaultRules();
  for (const id of run.talismans) {
    const t = talismanById(id);
    if (t && t.rules) t.rules(r);
  }
  if (opp.rule && opp.rule.rules) opp.rule.rules(r);
  r.handSize = r.handSize.map((h) => Math.max(3, h));
  return r;
}

function weightedPick(arr, weight, rng) {
  const total = arr.reduce((s, a) => s + weight(a), 0);
  let x = rng() * total;
  for (const a of arr) { x -= weight(a); if (x <= 0) return a; }
  return arr[arr.length - 1];
}

function rollShop(run, rng = Math.random) {
  const act = Math.min(2, Math.floor(run.table / 3));
  const owned = new Set(run.talismans);
  const weight = (t) => RARITY[t.rarity].weight * (t.rarity >= 3 ? 1 + act * 0.9 : 1);
  const offers = [];
  for (let i = 0; i < 3; i++) {
    const pool = TALISMANS.filter((t) => !owned.has(t.id) && !offers.some((o) => o.id === t.id));
    if (!pool.length) break;
    offers.push({ kind: 'talisman', id: weightedPick(pool, weight, rng).id, sold: false });
  }
  const tpool = TRICKS.slice();
  for (let i = 0; i < 2; i++) {
    const t = tpool.splice(Math.floor(rng() * tpool.length), 1)[0];
    offers.push({ kind: 'trick', id: t.id, sold: false });
  }
  return offers;
}

// Одна партия за столом: движок + талисманы + особые правила соперника.
class Match {
  constructor(run, opp, seed) {
    this.run = run;
    this.opp = opp;
    this.rng = mulberry32(seed);
    this.rules = buildRules(run, opp);
    this.g = new DurakGame(this.rules, this.rng);
    this.earned = [];
    this.usedActive = new Set();
    this.peekBout = -1;
    this.listener = null;
    this.g.on((type, ev) => this.onGameEvent(type, ev));
  }

  talismans() { return this.run.talismans.map(talismanById).filter(Boolean); }
  has(id) { return this.run.talismans.includes(id); }
  emit(type, data) { if (this.listener) this.listener(type, data || {}); }

  fx(source) {
    return {
      run: this.run,
      won: this.isWin(),
      earn: (v, label) => {
        if (v <= 0) return;
        this.earned.push({ v, label });
        this.emit('earn', { v, label, source });
      },
      note: (text) => this.emit('note', { text, source }),
      peek: () => { this.peekBout = this.g.boutNo; this.emit('peek'); },
      heal: (n) => { this.run.hearts = Math.min(this.run.maxHearts, this.run.hearts + n); this.emit('heal', { n }); },
    };
  }

  begin() {
    this.g.setup();
    for (const t of this.talismans()) if (t.deal) t.deal(this.fx(t.id), this.g);
    if (this.opp.rule && this.opp.rule.deal) this.opp.rule.deal(this.g);
    this.g.start();
  }

  onGameEvent(type, ev) {
    for (const t of this.talismans()) {
      const h = t.on && t.on[type];
      if (h) h(this.fx(t.id), ev, this.g);
    }
    this.emit(type, ev);
  }

  isWin() {
    const r = this.g.result;
    return r === 'win' || (r === 'draw' && this.has('mirovaya'));
  }

  outcome() {
    if (this.isWin()) return 'win';
    return this.g.result === 'draw' ? 'draw' : 'lose';
  }

  peeking() { return this.peekBout === this.g.boutNo; }

  canUseActive(id) {
    const t = talismanById(id);
    return !!(t && t.active && this.has(id) && !this.usedActive.has(id) && !this.g.over && this.g.actor() === 0 && t.canUse(this.g));
  }

  useActive(id) {
    if (!this.canUseActive(id)) return false;
    this.usedActive.add(id);
    talismanById(id).use(this.fx(id), this.g);
    this.emit('changed');
    return true;
  }

  canUseTrick(id, card) {
    const t = trickById(id);
    if (!t) return false;
    if (t.anytime) return t.can(this.g, this.run);
    if (this.g.over || this.g.actor() !== 0) return false;
    if (t.can && !t.can(this.g, this.run)) return false;
    if (card) return !t.canCard || t.canCard(this.g, card);
    return true;
  }

  useTrick(index, card) {
    const id = this.run.tricks[index];
    const t = trickById(id);
    if (!t || !this.canUseTrick(id, card)) return false;
    if (t.target === 'card' && !card) return false;
    this.run.tricks.splice(index, 1);
    t.use(this.fx(id), this.g, card);
    this.emit('changed');
    return true;
  }

  settle() {
    const lines = [];
    const out = this.outcome();
    if (out === 'win') {
      lines.push({ v: this.opp.reward, label: `Победа над: ${this.opp.name}` });
      if (this.g.hands[1].some((c) => c.r === 6)) lines.push({ v: 2, label: 'Погоны! Дурак остался с шестёркой' });
    }
    const merged = new Map();
    for (const e of this.earned) merged.set(e.label, (merged.get(e.label) || 0) + e.v);
    for (const [label, v] of merged) lines.push({ v, label });
    const before = this.earned.length;
    for (const t of this.talismans()) {
      const h = t.on && t.on.end;
      if (h) h(this.fx(t.id), this.g);
    }
    for (const e of this.earned.slice(before)) lines.push(e);
    return { out, lines, total: lines.reduce((s, l) => s + l.v, 0) };
  }
}

// ---------- звук ----------
const Sfx = {
  ctx: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    } catch (e) { this.ctx = null; }
  },
  env(node, gain, dur, when) {
    const t = this.ctx.currentTime + when;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    node.connect(g);
    g.connect(this.ctx.destination);
    return t;
  },
  noise(dur, freq, q, gain, type = 'bandpass', when = 0) {
    const len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = q;
    src.connect(f);
    const t = this.env(f, gain, dur, when);
    src.start(t);
    src.stop(t + dur + 0.02);
  },
  tone(freq, dur, type, gain, when = 0, slideTo = null) {
    const o = this.ctx.createOscillator();
    o.type = type;
    const t = this.env(o, gain, dur, when);
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  play(name) {
    if (!Store.data.settings.sound || !this.ctx) return;
    try {
      switch (name) {
        case 'card': this.noise(0.07, 2300, 0.9, 0.32); this.tone(190, 0.05, 'sine', 0.1); break;
        case 'draw': this.noise(0.05, 4200, 0.7, 0.1, 'highpass'); break;
        case 'bito': this.noise(0.24, 900, 0.6, 0.16); break;
        case 'take': this.tone(150, 0.2, 'sine', 0.22, 0, 70); this.noise(0.12, 600, 0.8, 0.12); break;
        case 'coin': this.tone(1320, 0.09, 'triangle', 0.11); this.tone(1760, 0.16, 'triangle', 0.09, 0.06); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.13, i * 0.09)); break;
        case 'lose': [392, 330, 262].forEach((f, i) => this.tone(f, 0.32, 'sawtooth', 0.05, i * 0.15)); break;
        case 'click': this.tone(880, 0.03, 'square', 0.035); break;
        case 'nope': this.tone(170, 0.12, 'square', 0.045); break;
        case 'buy': this.tone(988, 0.08, 'triangle', 0.12); this.tone(1319, 0.15, 'triangle', 0.11, 0.07); break;
        case 'magic': [660, 880, 1175].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.08, i * 0.05)); break;
        default: break;
      }
    } catch (e) { /* звук не критичен */ }
  },
};
